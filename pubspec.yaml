name: launcher
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  base_sdk:
    path: .rokct/cache/base
  auth_sdk:
    path: .rokct/cache/auth
  users_sdk:
    path: .rokct/cache/users
  launch_sdk:
    path: .rokct/cache/launch
  comms_sdk:
    path: .rokct/cache/comms
  telemetry_sdk:
    path: .rokct/cache/telemetry
  processing_sdk:
    path: .rokct/cache/processing
  productivity_sdk:
    path: .rokct/cache/productivity
  corporate_sdk:
    path: .rokct/cache/corporate
  desktop_sdk:
    path: .rokct/cache/desktop
  hms_sdk:
    path: .rokct/cache/hms
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  installed_apps: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Guided-tour runner (integration_test/guided_tour_test.dart) - drives the
  # demo build on the CI emulator for the marketing/tour screenshot pipeline.
  integration_test:
    sdk: flutter
  # Codegen toolchain for the composed shell: universal-guided-tour runs
  # `dart run build_runner build` before building, and the base_sdk-composed
  # lib/routes/app_router.dart declares `part 'app_router.gr.dart'`
  # (@AutoRouterConfig), so build_runner + auto_route_generator are required.
  # Versions match the fleet standard for tour-running shells (paas_driver /
  # supacharge).
  freezed: ^3.2.3
  build_runner: ^2.10.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # 9.x pins source_gen ^1.5/^2 which conflicts with freezed 3.x (source_gen
  # >=3); 10.3.x is the first line on analyzer 8 (10.4+ moves to auto_route
  # 11 / analyzer 10+, which drags freezed onto dev prereleases). Needs
  # auto_route 10.x at runtime - arbitrated in dependency_overrides below.
  auto_route_generator: '>=10.3.1 <10.4.0'

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # SDK-declared assets (manifest `app_assets`) are injected between the
  # sdk-app-assets markers by the SDK installer at compose time; this
  # `assets:` line is the anchor it needs. Add app-owned entries outside
  # the marker block.
  assets:
    # BEGIN sdk-app-assets (generated by SDK installer - do not edit by hand)
    - assets/audio/tap.wav
    - assets/audio/wrong.wav
    - assets/images/app_logo.png
    - assets/images/card.png
    - assets/images/cardBg.png
    - assets/images/delivery.png
    - assets/images/door.png
    - assets/images/fast.png
    - assets/images/logo.png
    - assets/images/notFound.png
    - assets/images/order.png
    - assets/images/save.png
    - assets/images/set.png
    - assets/images/splash.png
    - assets/images/splash1.png
    - assets/images/splash2.png
    - assets/images/ui0.png
    - assets/images/ui1.png
    - assets/images/ui2.png
    - assets/images/ui3.png
    - assets/images/visa.png
    - assets/lottie/girl_empty.json
    - assets/lottie/not-found.json
    - assets/lottie/not_found_page.json
    - assets/lottie/notification_empty.json
    - assets/lottie/processing.json
    - assets/svgs/adress.svg
    - assets/svgs/avatar.svg
    - assets/svgs/brand_logo_rounded.svg
    - assets/svgs/contact.svg
    - assets/svgs/delivery.svg
    - assets/svgs/delivery2.svg
    - assets/svgs/delivery_time.svg
    - assets/svgs/discount.svg
    - assets/svgs/empty.svg
    - assets/svgs/filter.svg
    - assets/svgs/orderTime.svg
    - assets/svgs/pickUpFrom.svg
    - assets/svgs/star.svg
    - assets/svgs/ticket.svg
    # END sdk-app-assets

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
dependency_overrides:
  # auto_route_generator 10.3.x needs auto_route 10.x, while the composed
  # SDKs still pin ^9.2.0 (resolves 9.3.0+1 here). 10.1+ keeps the renamed
  # 9.x APIs as deprecated aliases, so composed source compiles unchanged -
  # same arbitration as paas_driver and supacharge.
  auto_route: ^10.3.0
  # drift must stay on a release whose sqlite3 constraint admits the pinned
  # sqlite3 2.9.4 below (2.34.x moved to sqlite3 ^3.x and fails to compile
  # against it). Mirrors paas_driver's and supacharge's arbitration of the
  # same conflict.
  drift: 2.31.0
  sqlite3: 2.9.4
  # base_sdk declares share_plus ^10.1.1; productivity_sdk declares ^12.0.1
  # but its one call site (Share.share/Share.shareXFiles) is written against
  # the v10-era API, so ^12 was never actually exercised. Pin to what the
  # code uses, isolated to this app only - same pattern as supacharge's own
  # override, and it leaves productivity_sdk's declared constraint (and every
  # other app using it) untouched.
  share_plus: ^10.1.1
